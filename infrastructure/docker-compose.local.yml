services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: handfont
      POSTGRES_USER: handfont
      POSTGRES_PASSWORD: handfont
    ports: ["5432:5432"]
    volumes: ["handfont-postgres:/var/lib/postgresql/data"]
  worker:
    build: ../workers/font-engine
    env_file: ../.env
    environment:
      CONTROL_API_BASE_URL: http://host.docker.internal:3000
      WORKER_STORAGE_DRIVER: local
      WORKER_BLOB_DIR: /data/blob
      WORKER_RUNTIME_DIR: /data/runtime
    volumes:
      - ../runtime/blob:/data/blob
      - ../worker-runtime:/data/runtime
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes:
  handfont-postgres:

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>HandFont Studio v3.3.1 Preview</title><style>:root {

body {

}

a { color: inherit; }

.brand-title { font-size: 16px; font-weight: 760; letter-spacing: -.02em; }
.brand-subtitle { display: block; color: #9299a5; font-size: 11px; margin-top: 1px; }

.sidebar-footer { margin-top: auto; padding-top: 18px; }
.api-status {

  align-items: center;
  gap: 9px;

}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #7f8793; }

.main-wrap { margin-left: var(--sidebar); min-height: 100vh; }
.topbar {

  height: 36px;
  border-radius: 12px;

  background: var(--ink-800);

  font-size: 12px;
}

.page { padding: 32px 34px 56px; max-width: 1500px; margin: 0 auto; }
.page-head { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; margin-bottom: 26px; }
.page-title { margin: 0; font-size: clamp(28px, 4vw, 42px); letter-spacing: -.045em; line-height: 1.12; }

.grid { display: grid; gap: 18px; }

.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }

  gap: 30px;
  align-items: center;
}
.hero::before {
  content: "";
  position: absolute;
  width: 360px;
  height: 360px;
  right: -80px;
  top: -180px;
  border-radius: 50%;
  background: rgba(240,111,79,.19);
  filter: blur(1px);
}
.hero-copy { position: relative; z-index: 1; }
.hero h1 { margin: 0; font-size: clamp(34px, 5vw, 56px); line-height: 1.04; letter-spacing: -.055em; max-width: 720px; }
.hero p { color: #b9c0ca; max-width: 620px; margin: 18px 0 26px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }

.paper-stack { width: min(100%, 390px); aspect-ratio: 1.35; position: relative; }

.hero-chip { position: absolute; right: -6px; bottom: 18px; padding: 10px 14px; border-radius: 999px; background: var(--accent); color: var(--ink-950); font-weight: 800; box-shadow: var(--shadow-md); }

.btn {

.icon-button {

  height: 38px;
  border: 1px solid var(--ink-200);

  background: var(--surface);
  display: grid;
  place-items: center;
  color: var(--ink-700);
}

.stat-card { padding: 20px; }
.stat-label { color: var(--ink-600); font-size: 12px; font-weight: 700; }
.stat-value { margin-top: 7px; font-size: 30px; font-weight: 820; letter-spacing: -.04em; }
.stat-foot { color: var(--ink-500); font-size: 12px; margin-top: 4px; }
.stat-progress { height: 5px; border-radius: 999px; background: var(--ink-100); margin-top: 14px; overflow: hidden; }

.section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 34px 0 14px; }

.project-card { display: flex; flex-direction: column; min-height: 230px; overflow: hidden; }

  padding: 3px 8px;

  font-weight: 750;
}
.badge-ok { background: var(--mint-soft); color: var(--mint); }
.badge-review { background: var(--amber-soft); color: var(--amber); }

.badge-neutral { background: var(--ink-100); color: var(--ink-600); }

.form-card { max-width: 760px; padding: 26px; }
.form-grid { display: grid; gap: 18px; }
.field { display: grid; gap: 7px; }
.field label { font-size: 12px; font-weight: 760; color: var(--ink-700); }
.input, .textarea, .select {
  width: 100%;
  border: 1px solid var(--ink-200);

}

}
.step-number { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); font-weight: 850; }

.dropzone {

  border: 1.5px dashed var(--ink-300);

  background: var(--surface-soft);

}
.dropzone.dragging { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.005); }
.drop-icon { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; background: var(--ink-950); color: white; margin: 0 auto 16px; }

.dropzone p { color: var(--ink-600); margin: 8px 0 17px; }
.file-input { position: absolute; opacity: 0; pointer-events: none; }

.upload-item { display: flex; gap: 12px; align-items: center; padding: 13px 14px; border: 1px solid var(--ink-100); border-radius: 13px; background: white; }
.file-icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--ink-100); color: var(--ink-700); font-weight: 800; }
.file-info { min-width: 0; flex: 1; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-bottom: 16px; }
.search { flex: 1 1 220px; position: relative; }

.search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--ink-500); pointer-events: none; }
.segmented { display: inline-flex; padding: 3px; border: 1px solid var(--ink-200); border-radius: 12px; background: var(--surface); }

.glyph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.glyph-card {

  transition: transform .16s var(--ease), border .16s ease, box-shadow .16s ease;
}

.glyph-thumb { height: 72px; display: grid; place-items: center; background: var(--surface-soft); border-radius: 10px; }
.glyph-thumb img { width: 64px; height: 64px; object-fit: contain; }
.glyph-meta { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; margin-top: 8px; }

.glyph-state { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px white; }

.drawer-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(16,18,22,.42); backdrop-filter: blur(3px); animation: fade .18s ease; }

.drawer-head { display: flex; align-items: center; justify-content: space-between; }

.drawer-preview img { width: 72%; height: 72%; object-fit: contain; }
.metric-list { display: grid; gap: 0; border: 1px solid var(--ink-100); border-radius: 14px; overflow: hidden; }

.style-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
.control-panel { padding: 20px; position: sticky; top: 94px; }

.control-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 760; margin-bottom: 10px; }
.control-value { color: var(--accent-deep); font-variant-numeric: tabular-nums; }
.range { width: 100%; accent-color: var(--accent); }
.preset-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }

.preset span { display: block; color: var(--ink-500); font-size: 10px; margin-top: 4px; }
.preset.active { border-color: var(--accent); background: var(--accent-soft); }
.preview-stage { min-height: 610px; padding: 24px; overflow: hidden; }
.preview-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.paper-preview { min-height: 520px; border-radius: 18px; background: #fff; border: 1px solid var(--ink-100); padding: clamp(24px, 5vw, 56px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.9); }
.paper-preview.dark { background: #20242b; color: white; }
.preview-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--letter-gap, 0px); min-height: 90px; }
.preview-glyph { display: inline-grid; place-items: center; width: 64px; height: 74px; transform: scaleX(var(--glyph-width, 1)) skewX(var(--glyph-slant, 0deg)); transform-origin: center bottom; filter: drop-shadow(0 0 var(--glyph-weight, 0px) currentColor); }
.preview-glyph img { width: 100%; height: 100%; object-fit: contain; }
.preview-fallback { display: inline-block; font-size: 56px; transform: scaleX(var(--glyph-width, 1)) skewX(var(--glyph-slant, 0deg)); transform-origin: center bottom; }

.preview-controls { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.color-button { width: 31px; height: 31px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 0 1px var(--ink-300); }
.color-button.active { box-shadow: 0 0 0 2px var(--accent); }

.check-list { display: grid; gap: 10px; }
.check-item { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--surface-soft); border: 1px solid var(--ink-100); }
.check-icon { width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; background: var(--mint-soft); color: var(--mint); font-weight: 850; }

.export-card { padding: 26px; }

.job-progress span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }

.toast-region { position: fixed; right: 18px; bottom: 18px; z-index: 200; display: grid; gap: 9px; width: min(360px, calc(100vw - 36px)); }
.toast { padding: 13px 15px; border-radius: 13px; background: var(--ink-950); color: white; box-shadow: var(--shadow-md); font-size: 12px; animation: toastIn .22s var(--ease); }

function escapeHtml(value = '') {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function formatDate(value) {
  if (!value) return '-';
  try {
    return new Intl.DateTimeFormat('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(value));
  } catch {
    return value;
  }
}

function formatBytes(bytes = 0) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 ** 2).toFixed(1)} MB`;
}

async function api(path, options = {}) { return __mockApi(path, options); }

function toast(message, type = 'normal') {
  const node = document.createElement('div');
  node.className = `toast ${type === 'error' ? 'error' : ''}`;
  node.textContent = message;
  toastRegion.append(node);
  setTimeout(() => node.remove(), 3400);
}

function navigate(path) {
  location.hash = path;
  renderRoute();
}

function parseRoute() {
  const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  if (parts.length === 0) return { name: 'dashboard' };
  if (parts[0] === 'projects' && parts[1] === 'new') return { name: 'new-project' };
  if (parts[0] === 'projects' && parts[1]) {
    return { name: parts[2] || 'overview', projectId: parts[1] };
  }
  return { name: 'not-found' };
}

function navHref(projectId, key) {
  return projectId ? `/projects/${projectId}/${key}` : '#';
}

function shell(content, { project = null, active = null, title = 'HandFont Studio', breadcrumb = '웹 폰트 제작 스튜디오' } = {}) {
  const projectId = project?.id;
  const sidebarSteps = steps.map((step, index) => `
    <a class="nav-link ${active === step.key ? 'active' : ''} ${!projectId ? 'disabled' : ''}" href="${navHref(projectId, step.key)}" data-link>
      <span class="nav-icon">${icon(step.icon)}</span>
      <span>${step.label}</span>
      <span class="nav-index">${index + 1}</span>
    </a>
  `).join('');

  return `
    <div class="app-shell">
      <aside class="sidebar ${state.mobileNav ? 'open' : ''}" id="sidebar">
        <a class="brand" href="/" data-link>
          <span class="brand-mark">H</span>
          <span><span class="brand-title">HandFont Studio</span><span class="brand-subtitle">Cloud Web · v3.3.1</span></span>
        </a>
        <div class="sidebar-label">Workspace</div>
        <nav class="sidebar-nav" aria-label="주요 메뉴">
          <a class="nav-link ${active === 'dashboard' ? 'active' : ''}" href="/" data-link>
            <span class="nav-icon">${icon('home')}</span><span>프로젝트</span>
          </a>
          <a class="nav-link ${active === 'new-project' ? 'active' : ''}" href="/projects/new" data-link>
            <span class="nav-icon">${icon('plus')}</span><span>새 프로젝트</span>
          </a>
        </nav>
        <div class="sidebar-label" style="margin-top:24px">Production flow</div>
        <nav class="sidebar-nav" aria-label="폰트 제작 단계">${sidebarSteps}</nav>
        <div class="sidebar-footer">
          <div class="api-status"><span class="status-dot ${state.health?.status === 'ok' ? 'online' : ''}"></span><span>${state.health?.status === 'ok' ? 'Cloud API 준비' : 'API 확인 중'}</span></div>
        </div>
      </aside>
      <div class="main-wrap">
        <header class="topbar">
          <div style="display:flex;align-items:center;gap:12px;min-width:0">
            <button class="icon-button mobile-menu" type="button" data-action="toggle-nav" aria-label="메뉴 열기">${icon('menu')}</button>
            <div class="topbar-left"><div class="breadcrumb">${escapeHtml(breadcrumb)}</div><h2 class="topbar-title">${escapeHtml(title)}</h2></div>
          </div>
          <div class="topbar-actions">
            ${project ? `<a class="btn btn-secondary btn-small" href="/projects/${project.id}/preview" data-link>${icon('eye', 16)} 미리보기</a>` : ''}
            <div class="avatar" title="로컬 작업자">HF</div>
          </div>
        </header>
        <main class="page" id="main">${content}</main>
      </div>
    </div>
  `;
}

function loadingShell(message = '불러오는 중입니다.') {
  return shell(`<div class="loading"><div><div class="spinner" style="margin:0 auto 12px"></div>${escapeHtml(message)}</div></div>`);
}

async function loadHealth() {
  try { state.health = await api('/api/health'); } catch { state.health = { status: 'error' }; }
}

async function loadProjects() {
  state.projects = await api('/api/projects');
}

async function ensureProject(projectId) {
  if (!projectId) return null;
  if (state.project?.id === projectId) return state.project;
  state.project = await api(`/api/projects/${projectId}`);
  state.uploads = state.project.uploads || [];
  return state.project;
}

async function loadGlyphs(projectId, filters = state.filters) {
  const params = new URLSearchParams();
  if (filters.status && filters.status !== 'all') params.set('status', filters.status);
  if (filters.page) params.set('page', String(filters.page));
  if (filters.q) params.set('q', filters.q);
  state.glyphs = await api(`/api/projects/${projectId}/glyphs?${params}`);
  state.glyphMap = new Map(state.glyphs.map(g => [g.character, g]));
  return state.glyphs;
}

function renderNewProject() {
  const content = `

    <form class="card form-card" id="new-project-form">
      <div class="form-grid">
        <div class="field"><label for="project-name">프로젝트 이름</label><input class="input" id="project-name" name="name" required maxlength="80" placeholder="예: 지민의 손글씨" autofocus><span class="hint">작업 목록에서 구분하기 위한 이름입니다.</span></div>
        <div class="field"><label for="family-name">폰트 패밀리 이름</label><input class="input" id="family-name" name="family_name" required maxlength="80" placeholder="예: Jimin Hand"><span class="hint">설치 후 글꼴 목록에 표시될 영문 이름을 권장합니다.</span></div>
        <div class="field"><label for="description">설명</label><textarea class="textarea" id="description" name="description" maxlength="500" placeholder="프로젝트 목적이나 메모를 적어두세요."></textarea></div>
        <div class="form-actions"><a class="btn btn-secondary" href="/" data-link>취소</a><button class="btn btn-primary" type="submit">프로젝트 만들기 ${icon('arrow', 16)}</button></div>
      </div>
    </form>
  `;
  app.innerHTML = shell(content, { active: 'new-project', title: '새 프로젝트', breadcrumb: '프로젝트 설정' });
}

function pageHeading(step, title, description, extra = '') {
  const index = steps.findIndex(item => item.key === step) + 1;
  return `<div class="step-banner"><div class="step-number">${index}</div><div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(description)}</span></div>${extra}</div>`;
}

function renderUpload(project) {
  const uploadItems = (state.uploads || []).map(file => `
    <div class="upload-item"><div class="file-icon">${icon('file', 18)}</div><div class="file-info"><div class="file-name">${escapeHtml(file.original_name)}</div><div class="file-meta">${formatBytes(file.size)} · ${formatDate(file.created_at)}</div></div><span class="badge badge-ok">업로드됨</span></div>

  const content = `
    ${pageHeading('upload', '작성본 업로드', 'JPG, PNG, PDF를 올리면 프로젝트 폴더에 안전하게 저장합니다.')}

function glyphStatusBadge(status) {
  const map = { ok: ['badge-ok', '정상'], review: ['badge-review', '검수 필요'], missing: ['badge-missing', '누락'] };
  const [className, label] = map[status] || map.ok;
  return `<span class="badge ${className}">${label}</span>`;
}

function renderGlyphGrid() {
  const container = document.querySelector('#glyph-grid');
  if (!container) return;
  if (!state.glyphs.length) {
    container.innerHTML = '<div class="card empty-state" style="grid-column:1/-1">조건에 맞는 글리프가 없습니다.</div>';
    return;
  }
  container.innerHTML = state.glyphs.map(glyph => `
    <button class="glyph-card" type="button" data-action="open-glyph" data-glyph-id="${glyph.id}" aria-label="${escapeHtml(glyph.character)} 글리프 보기">
      <span class="glyph-state ${glyph.status}"></span>
      <div class="glyph-thumb"><img src="${glyph.svg_path}" alt="${escapeHtml(glyph.character)} 손글씨 글리프"></div>
      <div class="glyph-meta"><span class="glyph-char">${escapeHtml(glyph.character)}</span><span class="glyph-code">${escapeHtml(glyph.unicode)}</span></div>
    </button>
  `).join('');
}

function previewGlyphNodes(text, glyphMap = state.glyphMap) {
  return [...text].map(char => {
    const glyph = glyphMap.get(char);
    if (glyph) return `<span class="preview-glyph" title="${escapeHtml(glyph.unicode)}"><img src="${glyph.svg_path}" alt="${escapeHtml(char)}"></span>`;
    if (char === ' ') return '<span style="width:24px"></span>';
    return `<span class="preview-fallback">${escapeHtml(char)}</span>`;
  }).join('');
}

function styleVariables(style) {
  const weight = Math.max(0, (style.weight || 0) / 18);
  return `--glyph-width:${(style.width || 100) / 100};--glyph-slant:${style.slant || 0}deg;--glyph-weight:${weight}px;--letter-gap:${style.spacing || 0}px;`;
}

function closeDialog() { dialogRoot.innerHTML = ''; }

async function runJob(kind, targetId) {
  const project = state.project;
  if (!project) return;
  const target = document.querySelector(targetId);
  if (!target) return;
  try {
    const job = await api(`/api/projects/${project.id}/jobs`, { method: 'POST', body: JSON.stringify({ kind, payload: { source: 'web-mvp' } }) });
    target.innerHTML = `<div class="job-progress"><span style="width:0%"></span></div><div class="hint" style="margin-top:7px">작업을 준비하고 있습니다.</div>`;
    for (let i = 0; i < 20; i += 1) {
      await new Promise(resolve => setTimeout(resolve, 180));
      const current = await api(`/api/jobs/${job.id}`);
      target.querySelector('.job-progress span').style.width = `${current.progress}%`;
      target.querySelector('.hint').textContent = current.message || current.status;
      if (current.status === 'complete') { toast('정적 HTML에서는 화면 흐름만 확인할 수 있습니다. 실제 작업은 서버 패키지에서 실행됩니다.'); break; }
    }
  } catch (error) { toast(error.message, 'error'); }
}

async function saveStyleFromControls() {
  if (!state.project) return;
  const style = {};
  document.querySelectorAll('[data-style-key]').forEach(input => { style[input.dataset.styleKey] = Number(input.value); });
  style.line_height = state.project.style?.line_height || 150;
  try {
    state.project = await api(`/api/projects/${state.project.id}/style`, { method: 'PUT', body: JSON.stringify(style) });
  } catch (error) { toast(error.message, 'error'); }
}

function updateStylePreview() {
  const style = {};
  document.querySelectorAll('[data-style-key]').forEach(input => {
    style[input.dataset.styleKey] = Number(input.value);
    const value = document.querySelector(`#value-${input.dataset.styleKey}`);
    if (value) value.textContent = input.value;
  });
  const preview = document.querySelector('#style-preview');
  if (preview) preview.style.cssText = styleVariables(style);
}

function applyPreset(name) {
  const presets = {
    natural: { weight: 0, width: 100, slant: 0, roundness: 0, spacing: 0 },
    clean: { weight: -2, width: 92, slant: 0, roundness: 20, spacing: 1 },
    bold: { weight: 18, width: 104, slant: -2, roundness: 35, spacing: 2 },
  };
  const preset = presets[name];
  if (!preset) return;
  Object.entries(preset).forEach(([key, value]) => {
    const input = document.querySelector(`[data-style-key="${key}"]`);
    if (input) input.value = value;
  });
  document.querySelectorAll('.preset').forEach(button => button.classList.toggle('active', button.dataset.preset === name));
  updateStylePreview();
  saveStyleFromControls();
}

async function renderRoute() {
  state.route = parseRoute();
  state.mobileNav = false;
  closeDialog();
  app.innerHTML = loadingShell();
  try {
    if (!state.health) await loadHealth();
    if (state.route.name === 'dashboard') {
      await loadProjects();
      renderDashboard();
      return;
    }
    if (state.route.name === 'new-project') {
      renderNewProject();
      return;
    }
    if (state.route.projectId) {
      const project = await ensureProject(state.route.projectId);
      if (['review', 'style', 'preview'].includes(state.route.name)) await loadGlyphs(project.id);
      if (state.route.name === 'upload' || state.route.name === 'overview') renderUpload(project);
      else if (state.route.name === 'review') renderReview(project);
      else if (state.route.name === 'style') renderStyle(project);
      else if (state.route.name === 'preview') renderPreview(project);
      else if (state.route.name === 'export') renderExport(project);
      else navigate(`/projects/${project.id}/upload`);
      return;
    }
    app.innerHTML = shell('<div class="empty-state"><h1>페이지를 찾을 수 없습니다.</h1><a class="btn btn-primary" href="/" data-link>프로젝트로 돌아가기</a></div>');
  } catch (error) {
    app.innerHTML = shell(`<div class="card empty-state"><h1>화면을 불러오지 못했습니다.</h1><p>${escapeHtml(error.message)}</p><button class="btn btn-primary" data-action="reload">다시 시도</button></div>`);
  }
}

async function handleFileUpload(files) {
  if (!files?.length || !state.project) return;
  const form = new FormData();
  [...files].forEach(file => form.append('files', file));
  try {
    toast(`${files.length}개 파일을 업로드하고 있습니다.`);
    await api(`/api/projects/${state.project.id}/uploads`, { method: 'POST', body: form });
    state.project = null;
    await renderRoute();
    toast('파일 업로드가 완료되었습니다.');
  } catch (error) { toast(error.message, 'error'); }
}

app.addEventListener('click', async event => {
  const link = event.target.closest('[data-link]');
  if (link) {
    event.preventDefault();
    navigate(link.getAttribute('href'));
    return;
  }
  const actionNode = event.target.closest('[data-action]');
  if (!actionNode) return;
  const action = actionNode.dataset.action;
  if (action === 'toggle-nav') {
    state.mobileNav = !state.mobileNav;
    document.querySelector('#sidebar')?.classList.toggle('open', state.mobileNav);
  } else if (action === 'reload') {
    renderRoute();
  } else if (action === 'choose-files') {
    document.querySelector('#file-input')?.click();
  } else if (action === 'start-process') {
    runJob('process', '#job-box');
  } else if (action === 'start-export') {
    runJob('export', '#export-job');
  } else if (action === 'filter-status') {
    state.filters.status = actionNode.dataset.value;
    await loadGlyphs(state.project.id);
    renderReview(state.project);
  } else if (action === 'open-glyph') {
    const glyph = state.glyphs.find(item => item.id === Number(actionNode.dataset.glyphId));
    if (glyph) openGlyphDrawer(glyph);
  } else if (action === 'close-dialog') {
    closeDialog();
  } else if (action === 'set-glyph-status') {
    try {
      const glyphId = Number(actionNode.dataset.glyphId);
      const updated = await api(`/api/projects/${state.project.id}/glyphs/${glyphId}?status=${actionNode.dataset.status}`, { method: 'PATCH' });
      state.glyphs = state.glyphs.map(item => item.id === glyphId ? updated : item);
      closeDialog();
      renderGlyphGrid();
      toast(`${updated.character} 상태를 변경했습니다.`);
    } catch (error) { toast(error.message, 'error'); }
  } else if (action === 'preset') {
    applyPreset(actionNode.dataset.preset);
  } else if (action === 'reset-style') {
    applyPreset('natural');
  } else if (action === 'preview-bg') {
    state.preview.dark = actionNode.dataset.dark === 'true';
    renderPreview(state.project);
  }
});

app.addEventListener('submit', async event => {
  if (event.target.id !== 'new-project-form') return;
  event.preventDefault();
  const form = new FormData(event.target);
  try {
    const project = await api('/api/projects', {
      method: 'POST',
      body: JSON.stringify({ name: form.get('name'), family_name: form.get('family_name'), description: form.get('description') }),
    });
    toast('프로젝트를 만들었습니다.');
    state.project = null;
    navigate(`/projects/${project.id}/upload`);
  } catch (error) { toast(error.message, 'error'); }
});

app.addEventListener('change', async event => {
  if (event.target.id === 'file-input') {
    handleFileUpload(event.target.files);
  } else if (event.target.id === 'page-filter') {
    state.filters.page = Number(event.target.value);
    await loadGlyphs(state.project.id);
    renderReview(state.project);
  }
});

let searchTimer;
app.addEventListener('input', event => {
  if (event.target.id === 'glyph-search') {
    clearTimeout(searchTimer);
    state.filters.q = event.target.value;
    searchTimer = setTimeout(async () => {
      await loadGlyphs(state.project.id);
      renderGlyphGrid();
    }, 220);
  } else if (event.target.matches('[data-style-key]')) {
    updateStylePreview();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(saveStyleFromControls, 280);
  } else if (event.target.id === 'preview-text') {
    const text = event.target.value;
    const line = document.querySelector('#preview-line');
    if (line) line.innerHTML = previewGlyphNodes(text);
    document.querySelectorAll('.preview-glyph').forEach(node => { node.style.width = `${state.preview.size}px`; node.style.height = `${Math.round(state.preview.size * 1.15)}px`; });
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      try {
        state.project = await api(`/api/projects/${state.project.id}`, { method: 'PATCH', body: JSON.stringify({ preview_text: text }) });
      } catch {}
    }, 400);
  } else if (event.target.id === 'preview-size') {
    state.preview.size = Number(event.target.value);
    document.querySelectorAll('.preview-glyph').forEach(node => { node.style.width = `${state.preview.size}px`; node.style.height = `${Math.round(state.preview.size * 1.15)}px`; });
    document.querySelectorAll('.preview-fallback').forEach(node => { node.style.fontSize = `${state.preview.size * .88}px`; });
  }
});

app.addEventListener('dragover', event => {
  const dropzone = event.target.closest('#dropzone');
  if (!dropzone) return;
  event.preventDefault();
  dropzone.classList.add('dragging');
});
app.addEventListener('dragleave', event => {
  const dropzone = event.target.closest('#dropzone');
  if (dropzone) dropzone.classList.remove('dragging');
});
app.addEventListener('drop', event => {
  const dropzone = event.target.closest('#dropzone');
  if (!dropzone) return;
  event.preventDefault();
  dropzone.classList.remove('dragging');
  handleFileUpload(event.dataTransfer.files);
});

window.addEventListener('hashchange', renderRoute);
window.addEventListener('keydown', event => { if (event.key === 'Escape') closeDialog(); });

renderRoute();
</script></body></html>

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handfont-image-pipeline"
version = "1.3.0"
description = "Registration-marker and cell extraction proof of concept for HandFont Studio"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "PyMuPDF>=1.24,<2",
]

[project.scripts]
handfont-image-pipeline = "handfont_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["handfont_pipeline*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handfont-hangul-composer"
version = "1.7.0"
description = "Representative-syllable Hangul composition PoC for HandFont Studio"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python-headless>=4.8", "Pillow>=10.0", "fonttools>=4.50"]

[project.scripts]
handfont-hangul-composer = "handfont_hangul_composer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["handfont_hangul_composer*"]

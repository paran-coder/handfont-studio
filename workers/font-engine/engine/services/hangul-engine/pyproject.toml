[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handfont-hangul-engine"
version = "1.6.0"
description = "Hangul representative syllable decomposition and position-region PoC for HandFont Studio"
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless>=4.10,<5",
  "numpy>=2,<3",
  "Pillow>=12,<13",
]

[project.scripts]
handfont-hangul-engine = "handfont_hangul.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["handfont_hangul*"]
